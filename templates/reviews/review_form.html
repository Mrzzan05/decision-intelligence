{% extends "base.html" %}

{% block title %}Review {{ product }}{% endblock %}

{% block content %}
<div class="card">
    <h1>{% if is_editing %}Edit Review{% else %}Write Review{% endif %}: {{ product }}</h1>
    <form method="post">
        {% csrf_token %}
        {% for crit in criteria_list %}
            <div>
                <label for="criteria_{{ crit.id }}">{{ crit.name }}</label>
                <input type="number" id="criteria_{{ crit.id }}" name="criteria_{{ crit.id }}" min="1" max="10" value="{{ crit.initial_score }}" required>
            </div>
        {% endfor %}
        {{ form.as_p }}
        <button type="submit" class="btn">Save Review</button>
    </form>
</div>
{% endblock %}
