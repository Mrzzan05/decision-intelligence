[project]
name = "decision-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "django-environ>=0.14.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "coverage>=7.17.0",
    "django-debug-toolbar>=8.0.0",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/test_*.py",
    "manage.py",
    "config/*",
    ".venv/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
