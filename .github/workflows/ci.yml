name: Django CI & PostgreSQL Test Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: decision_intelligence
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "True"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      DATABASE_URL: "postgres://postgres:postgres_ci_password@127.0.0.1:5432/decision_intelligence"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run Django system & migration checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check

      - name: Execute automated test suite on PostgreSQL
        run: uv run python manage.py test --verbosity 2
